pipelines:
  default:
    - parallel:
        - step:
            name: ECom2 for PHP 8.1
            image: php:8.1
            caches:
              - composer
            script:
              - apt-get update && apt-get install -y unzip git redis
              - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              - pecl install redis
              - docker-php-ext-enable redis
              - echo "127.0.0.1 redis" >>/etc/hosts
              - cp phpunit.xml.example phpunit.xml
              - sed -i 's/name="BASIC_AUTH_USERNAME" value="REPLACEME"/name="BASIC_AUTH_USERNAME" value="au2toto2"/' phpunit.xml
              - sed -i 's/name="BASIC_AUTH_PASSWORD" value="REPLACEME"/name="BASIC_AUTH_PASSWORD" value="m7O2O7V6zXZOy54DIk4L3SM1oWp73itU"/' phpunit.xml
              - sed -i 's/name="STORE_ID" value="REPLACEME"/name="STORE_ID" value="3727e9e3-8c35-4bf1-b785-03284c0fd987"/' phpunit.xml
              - sed -i 's/name="JWT_AUTH_CLIENT_ID" value="REPLACEME"/name="JWT_AUTH_CLIENT_ID" value="tomas_t"/' phpunit.xml
              - sed -i 's/name="JWT_AUTH_CLIENT_SECRET" value="REPLACEME"/name="JWT_AUTH_CLIENT_SECRET" value="resurs123"/' phpunit.xml
              - composer install
              - composer require phpunit/phpunit
              - vendor/bin/phpunit --configuration ./phpunit.xml
            services:
              - redis

definitions:
  services:
    redis:
      image: redis:5.0-alpine
